# Настройки салона: услуги, мастера и их графики.
# Файл можно править без знания Python — после изменения перезапустите бота.

[salon]
name = "Барбершоп «Борода»"
address = "г. Томск, пр. Ленина, 1"
phone = "+7 3822 00-00-00"
# Шаг сетки времени в минутах: при 30 запись возможна на 10:00, 10:30, 11:00…
slot_step = 30
# На сколько дней вперёд можно записаться
days_ahead = 14
# Не раньше чем за сколько часов до начала можно записаться
min_hours_before = 1
# Не позже чем за сколько часов до начала клиент может сам отменить запись
cancel_hours_before = 3
# За сколько часов до визита присылать напоминания
reminders = [24, 2]
# Готовые причины отмены записи салоном — кнопки для админа (можно и написать свою)
cancel_reasons = ["Мастер заболел", "Технические причины", "Изменился график мастера"]

# --- Услуги ---
# name — название, minutes — длительность, price — цена в рублях

[[services]]
name = "Мужская стрижка"
minutes = 60
price = 1200

[[services]]
name = "Стрижка машинкой"
minutes = 30
price = 700

[[services]]
name = "Оформление бороды"
minutes = 30
price = 600

[[services]]
name = "Стрижка + борода"
minutes = 90
price = 1700

# --- Мастера ---
# services — какие услуги делает (названия как выше)
# days — рабочие дни: пн вт ср чт пт сб вс
# hours — рабочее время, breaks — перерывы (необязательно)

[[masters]]
name = "Алексей"
services = ["Мужская стрижка", "Стрижка машинкой", "Оформление бороды", "Стрижка + борода"]
days = ["пн", "вт", "ср", "чт", "пт"]
hours = "10:00-19:00"
breaks = ["14:00-15:00"]

[[masters]]
name = "Денис"
services = ["Мужская стрижка", "Стрижка машинкой"]
days = ["ср", "чт", "пт", "сб", "вс"]
hours = "11:00-20:00"
breaks = ["15:00-15:30"]
